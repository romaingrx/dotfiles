[general]
import = [
    "~/.config/theme/alacritty.toml",
]

[font]
# The family comes from the theme import above (lib/theme).
size = 13.0

[font.offset]
x = 0
y = 1

[window]
decorations = "Buttonless"
dynamic_title = true
opacity = 0.95

[env]
TERM = "xterm-256color"

[cursor.style]
shape = "Block"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"

[scrolling]
history = 10000

[mouse]
hide_when_typing = true
