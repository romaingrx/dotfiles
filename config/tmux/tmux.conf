set -g default-terminal "tmux-256color"
set -g mouse on
set-option -g extended-keys on

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind C attach-session -c "#{pane_current_path}" \; display-message "New working directory: #{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Vim-Tmux Navigator ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

bind l send-keys 'C-l'

# --- Plugins (pinned by Nix, loaded from ~/.config/tmux-nix/plugins.conf) ---
set -g @catppuccin_flavor 'mocha'
# Home Manager writes the flavor from lib/theme here; absent on a vanilla checkout.
source-file -q ~/.config/theme/tmux.conf

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '10'

source-file -q ~/.config/tmux-nix/plugins.conf
